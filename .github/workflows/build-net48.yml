name: .NET Framework 4.8 Migration Build

on:
  push:
    branches: [ net48-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-net48:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Restore and build
      run: msbuild app/GHelper.sln /restore /p:Configuration=Release /p:Platform=x64 /v:minimal
    - name: Publish
      run: msbuild app/GHelper.sln /t:Publish /p:Configuration=Release /p:Platform=x64 /v:minimal
    - name: Upload published GHelper
      uses: actions/upload-artifact@v4
      with:
        name: GHelper-net48-x64
        path: app/bin/x64/Release/publish/
        if-no-files-found: error
        retention-days: 14
